<!DOCTYPE html>
<html lang="fr" data-theme="light" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Logo.png">
    
    <!-- SEO Tags -->
    <title>EduFlex - Plateforme éducative hybride & bienveillante</title>
    <meta name="description" content="EduFlex réconcilie les élèves de 11 à 25 ans avec l'école grâce à un environnement flexible, un accompagnement humain par des enseignants de l'Éducation Nationale et une IA pédagogique disponible 24h/24.">
    <meta name="keywords" content="éducation hybride, école à la maison, phobie scolaire, harcèlement, accompagnement scolaire, IA pédagogique, soutien scolaire, enseignant tuteur">
    <meta name="author" content="EduFlex SAS">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="EduFlex - L'école réinventée avec bienveillance">
    <meta property="og:description" content="Une alternative scolaire sécurisante et flexible pour les élèves faisant face à des situations de vie complexes.">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN (for gorgeous UI icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- Sidebar Navigation (injected via JS for active states) -->
        <aside id="sidebar-nav" class="sidebar-nav" aria-label="Menu principal"></aside>
        
        <!-- Main Content Area -->
        <div class="main-layout">
            <!-- Global Header -->
            <header id="global-header" class="global-header"></header>
            
            <!-- Page Router Output -->
            <main id="main-content" class="main-content" tabIndex="-1" aria-live="polite">
                <!-- Views will be injected here -->
            </main>
        </div>

        <!-- Floating Chatbot Widget -->
        <div id="floating-chatbot" class="chatbot-widget-container" aria-label="Assistant IA flottant"></div>
    </div>

    <!-- Notification system -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
